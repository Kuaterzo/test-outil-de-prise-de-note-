[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pmo-notes"
version = "0.1.0"
description = "Assistant local de prise de notes et de synthèse de réunions pour PMO."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PMO Notes" }]
keywords = ["réunion", "transcription", "synthèse", "whisper", "pmo", "loopback"]

dependencies = [
    "numpy>=1.23",
    "soundcard>=0.4.3",
    "faster-whisper>=1.0.0",
    "requests>=2.28",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pmo-notes = "pmo_notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
